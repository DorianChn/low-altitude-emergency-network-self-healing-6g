base_scenario = "disaster_scenario.toml"

[experiment]
seeds = [2026, 2027, 2028, 2029, 2030, 2031, 2032, 2033, 2034, 2035, 2036, 2037, 2038, 2039, 2040, 2041, 2042, 2043, 2044, 2045]
mobility_axis_max_km_per_tick = 0.025

[energy]
battery_capacity_wh = 600.0
initial_battery_wh = 600.0
reserve_wh = 50.0
movement_wh_per_km = 18.0
hover_power_w = 80.0
relay_power_w = 120.0

[optimizer]
decision_interval_s = 20
prediction_horizon_steps = 3
beam_width = 6
position_signature_quantum_km = 0.05
congestion_threshold = 0.85
rescue_service_weight = 10.0
connection_weight = 3.0
recovery_bonus = 2.0
latency_penalty_weight = 1.5
energy_penalty_weight = 2.0
rescue_progress_weight = 4.0

