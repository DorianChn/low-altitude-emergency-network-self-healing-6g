[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "low-altitude-emergency-network-self-healing-6g"
version = "0.1.0"
description = "Reproducible abstract simulation for low-altitude emergency network recovery research"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
phase15 = ["openpyxl>=3.1,<4", "scipy>=1.12,<2"]

[project.scripts]
lowalt6g = "lowalt6g.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[dependency-groups]
dev = [
    "matplotlib>=3.8,<4",
]
